name: CI/CD — shartnoma.uz

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Type Check ─────────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

  # ─── Build on Runner + Ship Artifact to VPS ─────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: typecheck
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://kabinetim.uz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install deps (on runner)
        run: npm install --no-audit --no-fund

      - name: Build Next.js (on runner)
        # NEXT_PUBLIC_* env vars build paytida client bundle'ga embed qilinadi
        # (Next.js dizayni). Ular runner'da bo'lmasa, static generation crash qiladi.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Assemble standalone deployment
        # Next.js standalone tracing .next/static va public ni o'zi ko'chirmaydi.
        # Ularni standalone ichiga qo'lda ko'chiramiz.
        run: |
          cp -r .next/static .next/standalone/.next/
          cp -r public .next/standalone/

      - name: Pack hermetic artifact
        # Faqat .next/standalone/ — traced minimal node_modules bilan birga.
        # Tarball ~25-35MB (oldin ~100-200MB edi).
        run: |
          tar -czf deploy.tar.gz -C .next standalone
          ls -lh deploy.tar.gz

      - name: Copy artifact to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy.tar.gz"
          target: "/tmp/"

      - name: Extract & restart on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            APP_DIR=/home/alisher/shartnoma.uz
            cd "$APP_DIR"

            # Disk holatini log'da ko'rsatish
            df -h /home | tail -n 1

            # Eski standalone va node_modules o'chirish
            # .env.local va ecosystem.config.js untracked — tegilmaydi
            rm -rf .next node_modules
            mkdir -p .next

            # Yangi standalone'ni ochish — .next/standalone/ hosil bo'ladi
            # (tarball ichida top-level `standalone/` katalog, -C .next bilan
            # .next/standalone/ ga joylashadi)
            tar -xzf /tmp/deploy.tar.gz -C .next/
            rm /tmp/deploy.tar.gz

            # PM2 reload — yangilangan ecosystem.config.js ishlatiladi
            pm2 reload ecosystem.config.js --update-env

            echo "✅ Deployment complete — $(date)"
