name: CI/CD — shartnoma.uz

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Type Check ─────────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

  # ─── Build on Runner + Ship Artifact to VPS ─────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: typecheck
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://kabinetim.uz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install deps (on runner)
        run: npm install --no-audit --no-fund

      - name: Build Next.js (on runner)
        # NEXT_PUBLIC_* env vars build paytida client bundle'ga embed qilinadi
        # (Next.js dizayni). Ular runner'da bo'lmasa, static generation crash qiladi.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Prune dev dependencies
        # Build tugagandan keyin dev deps (TypeScript, ESLint, @types/*) kerak emas.
        # node_modules hajmini 2-3x qisqartiradi.
        run: npm prune --omit=dev

      - name: Pack hermetic artifact
        # Server'da npm umuman ishlamaydi — node_modules ham tarballga kiradi.
        # .next/cache/ — build cache, runtime uchun kerak emas.
        # node_modules ichidan docs/tests/examples chiqariladi — faqat runtime kodi.
        run: |
          tar \
            --exclude='.next/cache' \
            --exclude='node_modules/**/test' \
            --exclude='node_modules/**/tests' \
            --exclude='node_modules/**/__tests__' \
            --exclude='node_modules/**/docs' \
            --exclude='node_modules/**/doc' \
            --exclude='node_modules/**/examples' \
            --exclude='node_modules/**/example' \
            --exclude='node_modules/**/*.md' \
            --exclude='node_modules/**/*.markdown' \
            --exclude='node_modules/**/CHANGELOG*' \
            --exclude='node_modules/**/LICENSE*' \
            --exclude='node_modules/**/*.map' \
            --exclude='node_modules/**/.bin/*.ps1' \
            --exclude='node_modules/**/.bin/*.cmd' \
            -czf deploy.tar.gz \
            .next \
            node_modules \
            public \
            package.json \
            package-lock.json \
            next.config.ts \
            middleware.ts
          ls -lh deploy.tar.gz

      - name: Copy artifact to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy.tar.gz"
          target: "/tmp/"

      - name: Extract & restart on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            APP_DIR=/home/alisher/shartnoma.uz
            cd "$APP_DIR"

            # Disk holatini log'da ko'rsatish
            df -h /home | tail -n 1

            # Eski build va deps o'chirish (atomic almashtirish uchun)
            # .env.local va ecosystem.config.js untracked — tar ichida yo'q, tegmaydi
            rm -rf .next node_modules

            # Yangi artifactni ochish
            tar -xzf /tmp/deploy.tar.gz -C "$APP_DIR"
            rm /tmp/deploy.tar.gz

            # PM2 restart — ecosystem.config.js server'da, process nomi: shartnoma
            pm2 restart shartnoma --update-env

            echo "✅ Deployment complete — $(date)"
